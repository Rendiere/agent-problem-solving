<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 0 1240 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How a problem moves: you ask, the agent proposes, you approve, the agent keeps the conversation on it, and it ends done, parked or dropped</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1240" height="300" fill="#ffffff"/>

  <g fill="#f6f8fa" stroke="#57606a" stroke-width="1.5">
    <rect x="20" y="115" width="160" height="70" rx="10"/>
    <rect x="280" y="115" width="170" height="70" rx="10"/>
    <rect x="550" y="115" width="160" height="70" rx="10"/>
    <rect x="810" y="115" width="160" height="70" rx="10"/>
  </g>
  <g fill="#ffffff" stroke="#57606a" stroke-width="1.5">
    <rect x="1070" y="20" width="155" height="64" rx="10"/>
    <rect x="1070" y="118" width="155" height="64" rx="10"/>
    <rect x="1070" y="216" width="155" height="64" rx="10"/>
  </g>

  <g fill="#1f2328" text-anchor="middle">
    <text x="100" y="145" font-size="16" font-weight="600">1. You bring</text>
    <text x="100" y="167" font-size="13">a problem</text>
    <text x="365" y="145" font-size="16" font-weight="600">2. Proposed</text>
    <text x="365" y="167" font-size="13">problem + done-when</text>
    <text x="630" y="145" font-size="16" font-weight="600">3. Active</text>
    <text x="630" y="167" font-size="13">one at a time</text>
    <text x="890" y="145" font-size="16" font-weight="600">4. Kept on track</text>
    <text x="890" y="167" font-size="13">drift? the agent asks</text>
    <text x="1147" y="48" font-size="16" font-weight="600">5. Done</text>
    <text x="1147" y="69" font-size="13">lesson saved</text>
    <text x="1147" y="146" font-size="16" font-weight="600">5. Parked</text>
    <text x="1147" y="167" font-size="13">resumes later</text>
    <text x="1147" y="244" font-size="16" font-weight="600">5. Dropped</text>
    <text x="1147" y="265" font-size="13">called off</text>
  </g>

  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="150" x2="278" y2="150"/>
    <line x1="450" y1="150" x2="548" y2="150"/>
    <line x1="710" y1="150" x2="808" y2="150"/>
    <polyline points="970,135 995,135 995,52 1068,52"/>
    <line x1="970" y1="150" x2="1068" y2="150"/>
    <polyline points="970,165 995,165 995,248 1068,248"/>
  </g>

  <g fill="#57606a" font-size="12" text-anchor="middle">
    <text x="230" y="140">agent drafts</text>
    <text x="500" y="140">you approve</text>
    <text x="760" y="140">every reply</text>
    <text x="1032" y="44">you confirm</text>
    <text x="1032" y="142">you switch</text>
    <text x="1032" y="240">you drop it</text>
  </g>
</svg>
